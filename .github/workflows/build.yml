name: Build Flutter APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: flutter-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.24.0'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Dart
        run: flutter analyze

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: mawo-apk-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
          generate_release_notes: true

  notify:
    name: Build notification
    if: always()
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Write job summary
        run: |
          if [ "${{ needs.build.result }}" = "success" ]; then
            echo "## ✅ MAWO build succeeded" >> "$GITHUB_STEP_SUMMARY"
            echo "The release APK is available in the workflow artifacts." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## ❌ MAWO build failed" >> "$GITHUB_STEP_SUMMARY"
            echo "Open the failed build job above for the compiler output." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
